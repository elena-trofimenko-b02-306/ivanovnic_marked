{% extends "base.html" %}
{% block title %}Регистрация — Сергей Баринов{% endblock %}

{% block content %}
<div class="container auth-container">
  <div class="auth-card">
    <h1 class="auth-title">Регистрация</h1>
    <form method="post" class="auth-form">
      <div class="form-group">
        <label for="username">Имя пользователя</label>
        <input type="text" id="username" name="username"
               autocomplete="username" required
               value="{{ request.form.get('username', '') }}"/>
      </div>
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email"
               autocomplete="email" required
               value="{{ request.form.get('email', '') }}"/>
      </div>
      <div class="form-group">
        <label for="password">Пароль <span class="hint">(не менее 6 символов)</span></label>
        <input type="password" id="password" name="password"
               autocomplete="new-password" required/>
      </div>
      <div class="form-group">
        <label for="confirm">Повторите пароль</label>
        <input type="password" id="confirm" name="confirm"
               autocomplete="new-password" required/>
      </div>
      <button type="submit" class="btn btn-primary btn-full">Создать аккаунт</button>
    </form>
    <p class="auth-alt">Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a></p>
  </div>
</div>
{% endblock %}
